<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flapotter - La Loutre Tech</title>
    <style>
        /* Reset et base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: #87CEEB;
            color: #333;
            overflow: hidden;
            user-select: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Conteneur du jeu */
        #game-container {
            position: relative;
            width: 500px;
            height: 600px;
            background: url('./assets/images/environment/background.png') repeat-x;
            background-size: 500px 600px;
            border: 4px solid #2E8B57;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* Fond personnalisé (eau + ciel) */
        #game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 400px;
            background: linear-gradient(to bottom, #87CEEB, #1E90FF);
            z-index: 1;
        }

        #game-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to bottom, #4682B4, #5F9EA0);
            z-index: 1;
        }

        /* UI en haut */
        #ui {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        #progress-container {
            width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(to right, #FFD700, #FFA500);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        #progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        /* Loutre (sprite) */
        #loutre {
            position: absolute;
            width: 32px;
            height: 32px;
            background: url('./assets/images/player/idle.png') no-repeat center;
            background-size: contain;
            z-index: 10;
            left: 100px;
            top: 300px;
        }

        /* Tuyaux (obstacles) */
        .pipe {
            position: absolute;
            width: 64px;
            z-index: 5;
        }

        .pipe.top {
            top: 0;
        }

        .pipe.bottom {
            bottom: 0;
        }
        .obstacle {
            position: absolute;
            width: 80px;
            background: url('./assets/images/environment/spike.png') repeat-y;
            background-size: 80px 128px;
            left: -80px;
            z-index: 5;
        }

        .obstacle.top {
            height: 180px;
            top: 0;
        }

        .obstacle.bottom {
            height: 180px;
            bottom: 0;
        }

        /* Info Tech Popup */
        #info-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 25px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
        }

        #info-popup h2 {
            color: #FF8C00;
            margin-bottom: 15px;
            font-size: 24px;
        }

        #info-popup p {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        #info-popup button {
            background: #FFD700;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #info-popup button:hover {
            background: #FFA500;
            transform: scale(1.05);
        }

        /* Skills */
        #skills {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .skill {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #FFD700;
            opacity: 0.6;
            transition: all 0.3s;
            font-size: 20px;
        }

        .skill.active {
            opacity: 1;
            background: rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }

        /* Écran de fin */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            display: none;
        }

        #game-over h1 {
            color: #FFD700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #game-over p {
            color: white;
            font-size: 24px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }

        #game-over button {
            background: #FFD700;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #game-over button:hover {
            background: #FFA500;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        /* Écran de démarrage */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        #start-screen h1 {
            color: #FFD700;
            font-size: 56px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #start-screen p {
            color: white;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 350px;
            line-height: 1.6;
        }

        #start-screen button {
            background: #FFD700;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #start-screen button:hover {
            background: #FFA500;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        /* Sol (eau) */
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to right, #5F9EA0, #4682B4);
            z-index: 5;
        }

        /* Nuages (décor) */
        .cloud {
            position: absolute;
            background: url('./assets/images/environment/spike.png') no-repeat;
            background-size: contain;
            opacity: 0.8;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- UI -->
        <div id="ui">
            <div id="score">0</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
                <div id="progress-text">0/5</div>
            </div>
        </div>

        <!-- Loutre -->
        <div id="loutre"></div>

        <!-- Skills -->
        <div id="skills">
            <div class="skill" id="skill-double-jump" title="Double saut">↑↑</div>
            <div class="skill" id="skill-shield" title="Bouclier">🛡️</div>
            <div class="skill" id="skill-slow-mo" title="Ralentissement">⏳</div>
        </div>

        <!-- Sol -->
        <div id="ground"></div>

        <!-- Info Popup -->
        <div id="info-popup">
            <h2>💡 Info Tech !</h2>
            <p id="info-text">Débloque des points pour en savoir plus !</p>
            <button id="close-info">Super !</button>
        </div>

        <!-- Écran de démarrage -->
        <div id="start-screen">
            <h1>Flapotter</h1>
            <p>Aide la loutre 🦦 à éviter les algues et à collecter des infos tech !<br>
            <strong>Contrôles :</strong> Espace ou clic pour sauter.</p>
            <button id="start-button">Jouer</button>
        </div>

        <!-- Écran de fin -->
        <div id="game-over">
            <h1>Game Over !</h1>
            <p id="final-score">Score : 0</p>
            <button id="restart-button">Recommencer</button>
        </div>

        <!-- Nuages (décor) -->
        <div class="cloud" style="width: 120px; height: 40px; top: 50px; left: 20px;"></div>
        <div class="cloud" style="width: 100px; height: 30px; top: 120px; right: 30px;"></div>
        <div class="cloud" style="width: 150px; height: 50px; top: 200px; left: 50px;"></div>
    </div>

    <!-- Sons intégrés (Web Audio API) -->
    <script>
        // ==================== CONFIG ====================
        const CONFIG = {
            gravity: 0.25,          // Gravité plus légère
            jumpForce: -6,         // Saut moins puissant (plus contrôlable)
            pipeWidth: 64,         // Largeur des tuyaux
            pipeGap: 180,          // Espace entre les tuyaux (haut/bas)
            pipeFrequency: 2000,   // Fréquence d'apparition des tuyaux (ms)
            gameWidth: 500,        // Largeur du jeu
            gameHeight: 600,       // Hauteur du jeu
            loutreWidth: 32,       // Largeur de la loutre (correspond au sprite)
            loutreHeight: 32,      // Hauteur de la loutre
            speed: 1.5,            // Vitesse de défilement des tuyaux
            speedIncrease: 0.0001, // Accélération progressive
            maxSpeed: 2.5          // Vitesse maximale
        };

        // ==================== STATE ====================
        let state = {
            loutreY: 300,          // Position Y initiale de la loutre
            loutreVelocity: 0,     // Vitesse verticale
            pipes: [],             // Liste des tuyaux
            score: 0,              // Score
            highScore: localStorage.getItem('flapotterHighScore') || 0,
            gameActive: false,     // Le jeu est en cours ?
            gameOver: false,       // Game Over ?
            lastPipeTime: 0,       // Dernier temps d'apparition d'un tuyau
            speed: CONFIG.speed    // Vitesse actuelle
        };

        // ==================== DOM ELEMENTS ====================
        const gameContainer = document.getElementById('game-container');
        const loutre = document.getElementById('loutre');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScore = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');

        // ==================== INIT ====================
        function init() {
            // Position initiale de la loutre
            loutre.style.left = '100px';
            loutre.style.top = state.loutreY + 'px';
            loutre.style.width = CONFIG.loutreWidth + 'px';
            loutre.style.height = CONFIG.loutreHeight + 'px';

            // Afficher le score
            scoreDisplay.textContent = 'Score: 0';

            // Cacher l'écran de Game Over
            gameOverScreen.style.display = 'none';

            // Réinitialiser l'état
            state.loutreY = 300;
            state.loutreVelocity = 0;
            state.pipes = [];
            state.score = 0;
            state.gameActive = false;
            state.gameOver = false;
            state.lastPipeTime = 0;
            state.speed = CONFIG.speed;

            // Supprimer tous les tuyaux existants
            document.querySelectorAll('.pipe').forEach(pipe => pipe.remove());
        }

        // ==================== GAME LOOP ====================
        function gameLoop(timestamp) {
            if (!state.gameActive && !state.gameOver) return;

            // Mettre à jour la loutre
            updateLoutre();

            // Générer des tuyaux
            if (timestamp - state.lastPipeTime > CONFIG.pipeFrequency) {
                createPipe();
                state.lastPipeTime = timestamp;
            }

            // Mettre à jour les tuyaux
            updatePipes();

            // Vérifier les collisions
            checkCollisions();

            // Vérifier les points
            checkScore();

            // Augmenter la vitesse progressivement
            state.speed = Math.min(state.speed + CONFIG.speedIncrease * timestamp, CONFIG.maxSpeed);

            requestAnimationFrame(gameLoop);
        }

        // ==================== LOUTRE ====================
        function updateLoutre() {
            // Appliquer la gravité
            state.loutreVelocity += CONFIG.gravity;
            state.loutreY += state.loutreVelocity;

            // Limiter la position Y (ne pas sortir de l'écran)
            if (state.loutreY < 0) {
                state.loutreY = 0;
                state.loutreVelocity = 0;
            }
            if (state.loutreY > CONFIG.gameHeight - CONFIG.loutreHeight) {
                state.loutreY = CONFIG.gameHeight - CONFIG.loutreHeight;
                state.loutreVelocity = 0;
                if (state.gameActive) {
                    gameOver();
                }
            }

            // Mettre à jour la position de la loutre
            loutre.style.top = state.loutreY + 'px';
        }

        function jump() {
            if (!state.gameActive && !state.gameOver) {
                startGame();
            }
            if (state.gameActive && !state.gameOver) {
                state.loutreVelocity = CONFIG.jumpForce;
            }
        }

        // ==================== PIPES ====================
        function createPipe() {
            const pipeHeight = Math.floor(Math.random() * (CONFIG.gameHeight - CONFIG.pipeGap - 100)) + 50;
            const pipeTop = document.createElement('div');
            const pipeBottom = document.createElement('div');

            // Tuyau du haut
            pipeTop.className = 'pipe top';
            pipeTop.style.left = CONFIG.gameWidth + 'px';
            pipeTop.style.width = CONFIG.pipeWidth + 'px';
            pipeTop.style.height = pipeHeight + 'px';
            pipeTop.style.background = "url('./assets/images/environment/spike.png') repeat-y";
            pipeTop.style.backgroundSize = "64px 16px";

            // Tuyau du bas
            pipeBottom.className = 'pipe bottom';
            pipeBottom.style.left = CONFIG.gameWidth + 'px';
            pipeBottom.style.width = CONFIG.pipeWidth + 'px';
            pipeBottom.style.height = (CONFIG.gameHeight - pipeHeight - CONFIG.pipeGap) + 'px';
            pipeBottom.style.bottom = '0';
            pipeBottom.style.background = "url('./assets/images/environment/spike.png') repeat-y";
            pipeBottom.style.backgroundSize = "64px 16px";

            // Ajouter les tuyaux au conteneur
            gameContainer.appendChild(pipeTop);
            gameContainer.appendChild(pipeBottom);

            // Ajouter à la liste des tuyaux
            state.pipes.push({
                x: CONFIG.gameWidth,
                top: pipeTop,
                bottom: pipeBottom,
                passed: false,
                height: pipeHeight
            });
        }

        function updatePipes() {
            for (let i = state.pipes.length - 1; i >= 0; i--) {
                const pipe = state.pipes[i];
                pipe.x -= state.speed;
                pipe.top.style.left = pipe.x + 'px';
                pipe.bottom.style.left = pipe.x + 'px';

                // Supprimer les tuyaux hors de l'écran
                if (pipe.x < -CONFIG.pipeWidth) {
                    gameContainer.removeChild(pipe.top);
                    gameContainer.removeChild(pipe.bottom);
                    state.pipes.splice(i, 1);
                }
            }
        }

        // ==================== COLLISIONS ====================
        function checkCollisions() {
            const loutreRect = {
                x: parseInt(loutre.style.left),
                y: state.loutreY,
                width: CONFIG.loutreWidth,
                height: CONFIG.loutreHeight
            };

            // Vérifier les collisions avec les tuyaux
            for (const pipe of state.pipes) {
                const topRect = {
                    x: pipe.x,
                    y: 0,
                    width: CONFIG.pipeWidth,
                    height: pipe.height
                };

                const bottomRect = {
                    x: pipe.x,
                    y: CONFIG.gameHeight - (CONFIG.gameHeight - pipe.height - CONFIG.pipeGap),
                    width: CONFIG.pipeWidth,
                    height: CONFIG.gameHeight - pipe.height - CONFIG.pipeGap
                };

                // Collision avec le tuyau du haut
                if (
                    loutreRect.x + loutreRect.width > topRect.x &&
                    loutreRect.x < topRect.x + topRect.width &&
                    loutreRect.y + loutreRect.height > topRect.y &&
                    loutreRect.y < topRect.y + topRect.height
                ) {
                    gameOver();
                    return;
                }

                // Collision avec le tuyau du bas
                if (
                    loutreRect.x + loutreRect.width > bottomRect.x &&
                    loutreRect.x < bottomRect.x + bottomRect.width &&
                    loutreRect.y + loutreRect.height > bottomRect.y &&
                    loutreRect.y < bottomRect.y + bottomRect.height
                ) {
                    gameOver();
                    return;
                }
            }
        }

        // ==================== SCORE ====================
        function checkScore() {
            for (const pipe of state.pipes) {
                if (!pipe.passed && pipe.x + CONFIG.pipeWidth < parseInt(loutre.style.left)) {
                    pipe.passed = true;
                    state.score++;
                    scoreDisplay.textContent = 'Score: ' + state.score;

                    // Mettre à jour le high score
                    if (state.score > state.highScore) {
                        state.highScore = state.score;
                        localStorage.setItem('flapotterHighScore', state.highScore);
                    }
                }
            }
        }

        // ==================== GAME OVER ====================
        function gameOver() {
            state.gameActive = false;
            state.gameOver = true;
            finalScore.textContent = state.score;
            gameOverScreen.style.display = 'flex';
        }

        // ==================== START GAME ====================
        function startGame() {
            state.gameActive = true;
            state.gameOver = false;
            state.loutreY = 300;
            state.loutreVelocity = 0;
            state.pipes = [];
            state.score = 0;
            state.speed = CONFIG.speed;
            state.lastPipeTime = 0;
            scoreDisplay.textContent = 'Score: 0';
            gameOverScreen.style.display = 'none';
            document.querySelectorAll('.pipe').forEach(pipe => pipe.remove());
            requestAnimationFrame(gameLoop);
        }

        // ==================== EVENTS ====================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        document.addEventListener('click', () => {
            jump();
        });

        restartButton.addEventListener('click', () => {
            init();
        });

        // Initialiser le jeu
        init();
    </script>

</body>
</html>
