<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flapotter - La Loutre Tech</title>
    <style>
        /* Reset et base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: #87CEEB;
            color: #333;
            overflow: hidden;
            user-select: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Conteneur du jeu */
        #game-container {
            position: relative;
            width: 500px;
            height: 600px;
            background: url('assets/images/environment/background.png') repeat-x;
            background-size: 500px 600px;
            border: 4px solid #2E8B57;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* Fond personnalisé (eau + ciel) */
        #game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 400px;
            background: linear-gradient(to bottom, #87CEEB, #1E90FF);
            z-index: 1;
        }

        #game-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to bottom, #4682B4, #5F9EA0);
            z-index: 1;
        }

        /* UI en haut */
        #ui {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 100;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        #progress-container {
            width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(to right, #FFD700, #FFA500);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        #progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);
        }

        /* Loutre (sprite) */
        #loutre {
            position: absolute;
            width: 40px;
            height: 40px;
            background: url('assets/images/player/idle.png') no-repeat center;
            background-size: contain;
            z-index: 10;
            left: 100px;
            top: 300px;
            transition: transform 0.1s ease;
        }

        /* Obstacles (algues) */
        .obstacle {
            position: absolute;
            width: 80px;
            background: url('assets/images/environment/spike.png') repeat-y;
            background-size: 80px 128px;
            left: -80px;
            z-index: 5;
        }

        .obstacle.top {
            height: 180px;
            top: 0;
        }

        .obstacle.bottom {
            height: 180px;
            bottom: 0;
        }

        /* Info Tech Popup */
        #info-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 25px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: none;
        }

        #info-popup h2 {
            color: #FF8C00;
            margin-bottom: 15px;
            font-size: 24px;
        }

        #info-popup p {
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        #info-popup button {
            background: #FFD700;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #info-popup button:hover {
            background: #FFA500;
            transform: scale(1.05);
        }

        /* Skills */
        #skills {
            position: absolute;
            bottom: 15px;
            left: 15px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .skill {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #FFD700;
            opacity: 0.6;
            transition: all 0.3s;
            font-size: 20px;
        }

        .skill.active {
            opacity: 1;
            background: rgba(255, 215, 0, 0.4);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
        }

        /* Écran de fin */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
            display: none;
        }

        #game-over h1 {
            color: #FFD700;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #game-over p {
            color: white;
            font-size: 24px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }

        #game-over button {
            background: #FFD700;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #game-over button:hover {
            background: #FFA500;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        /* Écran de démarrage */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }

        #start-screen h1 {
            color: #FFD700;
            font-size: 56px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.9);
        }

        #start-screen p {
            color: white;
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 350px;
            line-height: 1.6;
        }

        #start-screen button {
            background: #FFD700;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        #start-screen button:hover {
            background: #FFA500;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
        }

        /* Sol (eau) */
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to right, #5F9EA0, #4682B4);
            z-index: 5;
        }

        /* Nuages (décor) */
        .cloud {
            position: absolute;
            background: url('assets/images/environment/spike.png') no-repeat;
            background-size: contain;
            opacity: 0.8;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- UI -->
        <div id="ui">
            <div id="score">0</div>
            <div id="progress-container">
                <div id="progress-bar"></div>
                <div id="progress-text">0/5</div>
            </div>
        </div>

        <!-- Loutre -->
        <div id="loutre"></div>

        <!-- Skills -->
        <div id="skills">
            <div class="skill" id="skill-double-jump" title="Double saut">↑↑</div>
            <div class="skill" id="skill-shield" title="Bouclier">🛡️</div>
            <div class="skill" id="skill-slow-mo" title="Ralentissement">⏳</div>
        </div>

        <!-- Sol -->
        <div id="ground"></div>

        <!-- Info Popup -->
        <div id="info-popup">
            <h2>💡 Info Tech !</h2>
            <p id="info-text">Débloque des points pour en savoir plus !</p>
            <button id="close-info">Super !</button>
        </div>

        <!-- Écran de démarrage -->
        <div id="start-screen">
            <h1>Flapotter</h1>
            <p>Aide la loutre 🦦 à éviter les algues et à collecter des infos tech !<br>
            <strong>Contrôles :</strong> Espace ou clic pour sauter.</p>
            <button id="start-button">Jouer</button>
        </div>

        <!-- Écran de fin -->
        <div id="game-over">
            <h1>Game Over !</h1>
            <p id="final-score">Score : 0</p>
            <button id="restart-button">Recommencer</button>
        </div>

        <!-- Nuages (décor) -->
        <div class="cloud" style="width: 120px; height: 40px; top: 50px; left: 20px;"></div>
        <div class="cloud" style="width: 100px; height: 30px; top: 120px; right: 30px;"></div>
        <div class="cloud" style="width: 150px; height: 50px; top: 200px; left: 50px;"></div>
    </div>

    <!-- Sons intégrés (Web Audio API) -->
    <script>
        // ==================== SOUNDS ====================
        const sounds = {
            jump: () => {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            },
            collision: () => {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            },
            info: () => {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.setValueAtTime(1000, audioCtx.currentTime);
                osc2.frequency.setValueAtTime(1300, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);
                osc1.start();
                osc2.start();
                osc1.stop(audioCtx.currentTime + 0.2);
                osc2.stop(audioCtx.currentTime + 0.2);
            },
            background: null
        };

        // ==================== CONFIG ====================
        const CONFIG = {
            gravity: 0.4,
            jumpForce: -8,
            obstacleSpeed: 1.5,
            obstacleGap: 200,
            obstacleFrequency: 2000,
            obstacleWidth: 80,
            loutreWidth: 40,
            loutreHeight: 40,
            gameWidth: 500,
            gameHeight: 600,
            minObstacleHeight: 100,
            maxObstacleHeight: 250,
            speedIncrease: 0.0005,
            maxSpeed: 3.5
        };

        // ==================== STATE ====================
        let state = {
            score: 0,
            highScore: localStorage.getItem('flapotterHighScore') || 0,
            isPlaying: false,
            gameOver: false,
            loutreY: 300,
            loutreVelocity: 0,
            obstacles: [],
            lastObstacleTime: 0,
            progress: 0,
            nextMilestone: 5,
            unlockedSkills: [],
            currentInfoIndex: 0,
            shieldActive: false,
            doubleJumpAvailable: false,
            slowMoActive: false,
            currentSpeed: CONFIG.obstacleSpeed,
            easyMode: true,
            easyModeTimer: 0,
            soundEnabled: true
        };

        // ==================== INFOS TECH ====================
        const INFOS_TECH = [
            { milestone: 5, title: "Le HTML", text: "Le HTML est le squelette d'une page web, comme les os pour un corps !" },
            { milestone: 10, title: "Le CSS", text: "Le CSS, c'est la décoration : couleurs, polices, animations..." },
            { milestone: 15, title: "JavaScript", text: "JavaScript, c'est le cerveau : il rend les pages interactives !" },
            { milestone: 20, title: "Les algorithmes", text: "Un algorithme, c'est une recette de cuisine pour un ordinateur." },
            { milestone: 25, title: "Le Cloud", text: "Le cloud, c'est comme un disque dur, mais sur Internet !" },
            { milestone: 30, title: "Git", text: "Git, c'est un système pour sauvegarder et partager du code en équipe." },
            { milestone: 35, title: "Les API", text: "Une API, c'est comme un menu au restaurant : tu commandes, le serveur te sert !" },
            { milestone: 40, title: "Le Responsive Design", text: "Le responsive design, c'est adapter un site pour mobile, tablette et PC !" }
        ];

        // ==================== SKILLS ====================
        const SKILLS = [
            { milestone: 10, id: 'double-jump', name: "Double saut", icon: "↑↑" },
            { milestone: 20, id: 'shield', name: "Bouclier", icon: "🛡️" },
            { milestone: 30, id: 'slow-mo', name: "Ralentissement", icon: "⏳" }
        ];

        // ==================== DOM ELEMENTS ====================
        const loutre = document.getElementById('loutre');
        const scoreElement = document.getElementById('score');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const infoPopup = document.getElementById('info-popup');
        const infoText = document.getElementById('info-text');
        const closeInfoButton = document.getElementById('close-info');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const gameContainer = document.getElementById('game-container');

        // Skills elements
        const skillDoubleJump = document.getElementById('skill-double-jump');
        const skillShield = document.getElementById('skill-shield');
        const skillSlowMo = document.getElementById('skill-slow-mo');

        // ==================== INIT ====================
        function init() {
            loutre.style.left = `${CONFIG.gameWidth / 4}px`;
            loutre.style.top = `${state.loutreY}px`;

            document.addEventListener('keydown', handleKeyDown);
            gameContainer.addEventListener('click', handleClick);
            startButton.addEventListener('click', startGame);
            restartButton.addEventListener('click', restartGame);
            closeInfoButton.addEventListener('click', closeInfoPopup);

            startScreen.style.display = 'flex';
            gameOverScreen.style.display = 'none';
        }

        // ==================== GAME LOOP ====================
        function gameLoop(timestamp) {
            if (!state.isPlaying) return;

            updateLoutre();
            generateObstacles(timestamp);
            updateObstacles();
            checkCollisions();
            checkMilestones();

            if (!state.easyMode && state.currentSpeed < CONFIG.maxSpeed) {
                state.currentSpeed += CONFIG.speedIncrease;
            }

            if (state.easyMode && timestamp - state.easyModeTimer > 15000) {
                state.easyMode = false;
                state.currentSpeed = 2.0;
            }

            requestAnimationFrame(gameLoop);
        }

        // ==================== LOUTRE ====================
        function updateLoutre() {
            state.loutreVelocity += CONFIG.gravity;
            state.loutreY += state.loutreVelocity;

            if (state.loutreY < 0) {
                state.loutreY = 0;
                state.loutreVelocity = 0;
            }
            if (state.loutreY > CONFIG.gameHeight - CONFIG.loutreHeight) {
                state.loutreY = CONFIG.gameHeight - CONFIG.loutreHeight;
                state.loutreVelocity = 0;
                if (state.isPlaying) gameOver();
            }

            loutre.style.top = `${state.loutreY}px`;
            const rotation = Math.min(Math.max(state.loutreVelocity, -10), 10) * 2;
            loutre.style.transform = `rotate(${rotation}deg)`;
        }

        function jump() {
            if (state.soundEnabled) sounds.jump();
            if (state.doubleJumpAvailable && state.loutreVelocity > 0) {
                state.loutreVelocity = CONFIG.jumpForce * 0.9;
                state.doubleJumpAvailable = false;
                skillDoubleJump.style.opacity = '0.6';
            } else if (state.loutreY > 0) {
                state.loutreVelocity = CONFIG.jumpForce;
            }
        }

        // ==================== OBSTACLES ====================
        function generateObstacles(timestamp) {
            if (timestamp - state.lastObstacleTime > CONFIG.obstacleFrequency) {
                createObstacle();
                state.lastObstacleTime = timestamp;
            }
        }

        function createObstacle() {
            const minHeight = CONFIG.minObstacleHeight;
            const maxHeight = CONFIG.maxObstacleHeight;
            const gap = CONFIG.obstacleGap;
            const totalHeight = CONFIG.gameHeight - gap;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            const bottomHeight = totalHeight - topHeight;

            const obstacleTop = document.createElement('div');
            const obstacleBottom = document.createElement('div');

            obstacleTop.className = 'obstacle top';
            obstacleBottom.className = 'obstacle bottom';

            obstacleTop.style.height = `${topHeight}px`;
            obstacleBottom.style.height = `${bottomHeight}px`;

            obstacleTop.style.left = `${CONFIG.gameWidth}px`;
            obstacleBottom.style.left = `${CONFIG.gameWidth}px`;

            gameContainer.appendChild(obstacleTop);
            gameContainer.appendChild(obstacleBottom);

            state.obstacles.push({
                top: obstacleTop,
                bottom: obstacleBottom,
                passed: false,
                x: CONFIG.gameWidth
            });
        }

        function updateObstacles() {
            for (let i = state.obstacles.length - 1; i >= 0; i--) {
                const obstacle = state.obstacles[i];
                obstacle.x -= state.currentSpeed;

                obstacle.top.style.left = `${obstacle.x}px`;
                obstacle.bottom.style.left = `${obstacle.x}px`;

                if (obstacle.x < CONFIG.gameWidth / 4 - CONFIG.obstacleWidth && !obstacle.passed) {
                    obstacle.passed = true;
                    state.score++;
                    state.progress++;
                    updateScore();
                    if (state.soundEnabled) sounds.info();
                }

                if (obstacle.x < -CONFIG.obstacleWidth) {
                    gameContainer.removeChild(obstacle.top);
                    gameContainer.removeChild(obstacle.bottom);
                    state.obstacles.splice(i, 1);
                }
            }
        }

        // ==================== COLLISIONS ====================
        function checkCollisions() {
            const loutreRect = {
                x: parseInt(loutre.style.left),
                y: state.loutreY,
                width: CONFIG.loutreWidth,
                height: CONFIG.loutreHeight
            };

            for (const obstacle of state.obstacles) {
                const topRect = {
                    x: obstacle.x,
                    y: 0,
                    width: CONFIG.obstacleWidth,
                    height: parseInt(obstacle.top.style.height)
                };

                const bottomRect = {
                    x: obstacle.x,
                    y: CONFIG.gameHeight - parseInt(obstacle.bottom.style.height),
                    width: CONFIG.obstacleWidth,
                    height: parseInt(obstacle.bottom.style.height)
                };

                if (
                    loutreRect.x < topRect.x + topRect.width &&
                    loutreRect.x + loutreRect.width > topRect.x &&
                    loutreRect.y < topRect.y + topRect.height &&
                    loutreRect.y + loutreRect.height > topRect.y
                ) {
                    if (!state.shieldActive) {
                        if (state.soundEnabled) sounds.collision();
                        gameOver();
                    } else {
                        gameContainer.removeChild(obstacle.top);
                        gameContainer.removeChild(obstacle.bottom);
                        state.obstacles = state.obstacles.filter(o => o !== obstacle);
                        state.shieldActive = false;
                        skillShield.style.opacity = '0.6';
                    }
                    return;
                }

                if (
                    loutreRect.x < bottomRect.x + bottomRect.width &&
                    loutreRect.x + loutreRect.width > bottomRect.x &&
                    loutreRect.y < bottomRect.y + bottomRect.height &&
                    loutreRect.y + loutreRect.height > bottomRect.y
                ) {
                    if (!state.shieldActive) {
                        if (state.soundEnabled) sounds.collision();
                        gameOver();
                    } else {
                        gameContainer.removeChild(obstacle.top);
                        gameContainer.removeChild(obstacle.bottom);
                        state.obstacles = state.obstacles.filter(o => o !== obstacle);
                        state.shieldActive = false;
                        skillShield.style.opacity = '0.6';
                    }
                    return;
                }
            }
        }

        // ==================== MILESTONES ====================
        function checkMilestones() {
            for (const info of INFOS_TECH) {
                if (state.score >= info.milestone && state.score < info.milestone + 1 && state.currentInfoIndex < INFOS_TECH.indexOf(info) + 1) {
                    state.currentInfoIndex = INFOS_TECH.indexOf(info);
                    showInfoPopup(info);
                }
            }

            for (const skill of SKILLS) {
                if (state.score >= skill.milestone && !state.unlockedSkills.includes(skill.id)) {
                    state.unlockedSkills.push(skill.id);
                    unlockSkill(skill);
                }
            }

            updateProgressBar();
        }

        function updateProgressBar() {
            const progress = state.score % state.nextMilestone;
            const percentage = (progress / state.nextMilestone) * 100;
            progressBar.style.width = `${percentage}%`;
            progressText.textContent = `${progress}/${state.nextMilestone}`;
        }

        function showInfoPopup(info) {
            infoText.textContent = info.text;
            infoPopup.style.display = 'block';
            state.isPlaying = false;
        }

        function closeInfoPopup() {
            infoPopup.style.display = 'none';
            state.isPlaying = true;
            requestAnimationFrame(gameLoop);
        }

        function unlockSkill(skill) {
            switch (skill.id) {
                case 'double-jump':
                    state.doubleJumpAvailable = true;
                    skillDoubleJump.classList.add('active');
                    skillDoubleJump.style.opacity = '1';
                    break;
                case 'shield':
                    skillShield.classList.add('active');
                    skillShield.style.opacity = '1';
                    break;
                case 'slow-mo':
                    skillSlowMo.classList.add('active');
                    skillSlowMo.style.opacity = '1';
                    break;
            }
        }

        // ==================== SCORE ====================
        function updateScore() {
            scoreElement.textContent = state.score;
            if (state.score > state.highScore) {
                state.highScore = state.score;
                localStorage.setItem('flapotterHighScore', state.highScore);
            }
        }

        // ==================== GAME STATES ====================
        function startGame() {
            state = {
                score: 0,
                highScore: localStorage.getItem('flapotterHighScore') || 0,
                isPlaying: true,
                gameOver: false,
                loutreY: 300,
                loutreVelocity: 0,
                obstacles: [],
                lastObstacleTime: 0,
                progress: 0,
                nextMilestone: 5,
                unlockedSkills: [],
                currentInfoIndex: 0,
                shieldActive: false,
                doubleJumpAvailable: false,
                slowMoActive: false,
                currentSpeed: CONFIG.obstacleSpeed,
                easyMode: true,
                easyModeTimer: performance.now(),
                soundEnabled: true
            };

            loutre.style.left = `${CONFIG.gameWidth / 4}px`;
            loutre.style.top = `${state.loutreY}px`;
            loutre.style.transform = 'rotate(0deg)';
            scoreElement.textContent = '0';
            progressBar.style.width = '0%';
            progressText.textContent = '0/5';

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            infoPopup.style.display = 'none';

            skillDoubleJump.classList.remove('active');
            skillShield.classList.remove('active');
            skillSlowMo.classList.remove('active');
            skillDoubleJump.style.opacity = '0.6';
            skillShield.style.opacity = '0.6';
            skillSlowMo.style.opacity = '0.6';

            document.querySelectorAll('.obstacle').forEach(el => el.remove());
            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            state.isPlaying = false;
            state.gameOver = true;
            finalScoreElement.textContent = `Score : ${state.score}`;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            startGame();
        }

        // ==================== INPUT ====================
        function handleKeyDown(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (state.isPlaying) {
                    jump();
                } else if (state.gameOver) {
                    restartGame();
                } else if (!state.isPlaying && !state.gameOver) {
                    startGame();
                }
            }

            if (state.isPlaying) {
                if (e.code === 'KeyD' && state.unlockedSkills.includes('double-jump')) {
                    state.doubleJumpAvailable = true;
                    skillDoubleJump.style.opacity = '1';
                }
                if (e.code === 'KeyS' && state.unlockedSkills.includes('shield')) {
                    state.shieldActive = true;
                    skillShield.style.opacity = '1';
                    setTimeout(() => {
                        state.shieldActive = false;
                        skillShield.style.opacity = '0.6';
                    }, 5000);
                }
                if (e.code === 'KeyF' && state.unlockedSkills.includes('slow-mo')) {
                    state.slowMoActive = true;
                    state.currentSpeed = 1.0;
                    skillSlowMo.style.opacity = '1';
                    setTimeout(() => {
                        state.slowMoActive = false;
                        state.currentSpeed = state.easyMode ? CONFIG.obstacleSpeed : 2.0;
                        skillSlowMo.style.opacity = '0.6';
                    }, 5000);
                }
                if (e.code === 'KeyM') {
                    state.soundEnabled = !state.soundEnabled;
                }
            }
        }

        function handleClick(e) {
            if (state.isPlaying) {
                jump();
            } else if (state.gameOver) {
                restartGame();
            } else if (!state.isPlaying && !state.gameOver) {
                startGame();
            }
        }

        // ==================== START ====================
        init();
    </script>
</body>
</html>
